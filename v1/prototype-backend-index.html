<title>栖木家居 · 后台管理原型</title>
<style>
  /* ============ 设计系统（后台 · Ant Design 风格） ============ */
  :root{
    --primary:#1677FF;        /* AntD 主色 */
    --primary-hover:#4096FF;
    --primary-soft:#E6F0FF;
    --sider:#0F1B2D;          /* 暗色侧栏 */
    --sider-2:#16233A;
    --header-h:56px;
    --sider-w:232px;
    --bg:#F0F2F5;             /* 内容区底色 */
    --surface:#FFFFFF;
    --text:#1F1F1F;
    --text-2:#595959;
    --muted:#8C8C8C;
    --border:#F0F0F0;
    --border-2:#D9D9D9;
    --success:#389E0D; --success-bg:#F6FFED; --success-bd:#B7EB8F;
    --warning:#D46B08; --warning-bg:#FFFBE6; --warning-bd:#FFE58F;
    --danger:#CF1322; --danger-bg:#FFF1F0; --danger-bd:#FFCCC7;
    --radius:8px;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
    --z:50;
    --sans:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--text-2);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{color:var(--text);font-weight:600}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  .cursor-pointer{cursor:pointer}
  :focus-visible{outline:2px solid var(--primary);outline-offset:1px}
  svg{display:block}

  /* ============ 登录 ============ */
  .login{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0F1B2D,#1D3A5F)}
  .login-card{width:400px;max-width:92vw;background:#fff;border-radius:14px;padding:40px 36px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .login-brand .logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#69B1FF);display:flex;align-items:center;justify-content:center;color:#fff}
  .login-brand .logo svg{width:24px;height:24px}
  .login-brand .t{font-size:20px;color:var(--text);font-weight:700}
  .login-sub{color:var(--muted);font-size:13px;margin:4px 0 26px}
  .login-field{margin-bottom:18px}
  .login-field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;font-weight:600}
  .login-field .inp{display:flex;align-items:center;border:1px solid var(--border-2);border-radius:8px;padding:0 12px;transition:border-color .2s,box-shadow .2s}
  .login-field .inp:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
  .login-field .inp svg{width:18px;height:18px;color:var(--muted)}
  .login-field input{flex:1;border:none;outline:none;padding:11px 10px;font-size:15px;font-family:inherit;color:var(--text);background:transparent}
  .login-field input::placeholder{color:#bfbfbf}
  .login-btn{width:100%;background:var(--primary);color:#fff;padding:12px;border-radius:8px;font-size:15px;font-weight:600;transition:background .2s}
  .login-btn:hover{background:var(--primary-hover)}
  .login-btn:disabled{background:#bfbfbf;cursor:not-allowed}
  .login-hint{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
  .login-err{background:var(--danger-bg);border:1px solid var(--danger-bd);color:var(--danger);font-size:13px;padding:8px 12px;border-radius:8px;margin-bottom:14px;display:none}
  .login-roles{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .login-roles button{flex:1;min-height:40px;border:1px solid var(--border-2);border-radius:8px;font-size:12px;color:var(--text-2);background:#fafafa;transition:all .2s}
  .login-roles button:hover{border-color:var(--primary);color:var(--primary)}

  /* ============ 后台壳 ============ */
  #admin{display:none;height:100vh;overflow:hidden}
  #admin.show{display:flex}
  .sider{width:var(--sider-w);background:var(--sider);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
  .sider.collapsed{width:64px}
  .sider-brand{height:var(--header-h);display:flex;align-items:center;gap:10px;padding:0 18px;color:#fff;font-weight:700;font-size:16px;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap;overflow:hidden}
  .sider-brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#69B1FF);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
  .sider-brand .logo svg{width:18px;height:18px}
  .sider-menu{flex:1;overflow-y:auto;padding:8px}
  .sider-menu::-webkit-scrollbar{width:6px}
  .sider-menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
  .mi{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:8px;color:rgba(255,255,255,.78);font-size:14px;cursor:pointer;transition:background .2s,color .2s;white-space:nowrap;overflow:hidden}
  .mi:hover{background:rgba(255,255,255,.08);color:#fff}
  .mi.active{background:var(--primary);color:#fff}
  .mi svg{width:18px;height:18px;flex-shrink:0}
  .mi .arrow{margin-left:auto;transition:transform .2s}
  .mi.open .arrow{transform:rotate(90deg)}
  .mi .label{transition:opacity .15s}
  .submenu{overflow:hidden;max-height:0;transition:max-height .25s ease}
  .submenu.open{max-height:400px}
  .submenu .mi{padding-left:46px;font-size:13px;height:38px}
  .sider.collapsed .label,.sider.collapsed .arrow{opacity:0;width:0}
  .sider.collapsed .submenu{display:none}

  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .header{height:var(--header-h);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
  .header-left{display:flex;align-items:center;gap:14px}
  .collapse-btn{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:background .2s}
  .collapse-btn:hover{background:var(--bg)}
  .collapse-btn svg{width:20px;height:20px}
  .breadcrumb{color:var(--muted);font-size:14px}
  .breadcrumb b{color:var(--text)}
  .header-right{display:flex;align-items:center;gap:14px}
  .role-badge{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--primary-soft);color:var(--primary);font-weight:600}
  .user{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#69B1FF);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .logout{color:var(--text-2);font-size:13px;display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:8px;transition:background .2s}
  .logout:hover{background:var(--bg);color:var(--danger)}
  .logout svg{width:16px;height:16px}
  .content{flex:1;overflow-y:auto;padding:20px}
  .content::-webkit-scrollbar{width:8px}
  .content::-webkit-scrollbar-thumb{background:#d0d0d0;border-radius:4px}

  /* ============ 通用组件 ============ */
  .page-head{margin-bottom:18px}
  .page-head h2{font-size:20px;margin-bottom:4px}
  .page-head p{color:var(--muted);font-size:13px}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
  .card-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .toolbar .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 16px;border-radius:7px;font-size:14px;font-weight:500;transition:all .2s;border:1px solid transparent}
  .btn svg{width:15px;height:15px}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-hover)}
  .btn-default{background:#fff;border-color:var(--border-2);color:var(--text)}
  .btn-default:hover{border-color:var(--primary);color:var(--primary)}
  .btn-danger{background:#fff;border-color:var(--danger-bd);color:var(--danger)}
  .btn-danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn-sm{height:28px;padding:0 12px;font-size:13px}
  .link{color:var(--primary);cursor:pointer;margin-right:10px}
  .link:hover{color:var(--primary-hover);text-decoration:underline}

  /* 统计卡 */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
  .stat{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;display:flex;align-items:center;gap:16px}
  .stat .ic{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .stat .ic svg{width:26px;height:26px;color:#fff}
  .stat .n{font-size:26px;font-weight:700;color:var(--text);line-height:1.1}
  .stat .l{font-size:13px;color:var(--muted)}

  /* 表格 */
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{background:#FAFAFA;text-align:left;padding:12px 14px;color:var(--text-2);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;font-size:13px}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
  tbody tr:hover{background:#FAFCFF}
  .tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:5px;font-weight:500;line-height:1.5}
  .tag-green{background:var(--success-bg);color:var(--success);border:1px solid var(--success-bd)}
  .tag-red{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-bd)}
  .tag-blue{background:var(--primary-soft);color:var(--primary);border:1px solid #BAD6FF}
  .tag-gold{background:var(--warning-bg);color:var(--warning);border:1px solid var(--warning-bd)}
  .tag-gray{background:#fafafa;color:var(--muted);border:1px solid var(--border-2)}
  .thumb-sm{width:46px;height:34px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px}

  /* 搜索/筛选 */
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:16px}
  .filters .f{display:flex;flex-direction:column;gap:5px}
  .filters .f label{font-size:12px;color:var(--muted)}
  .filters input,.filters select{font-family:inherit;font-size:14px;height:34px;padding:0 12px;border:1px solid var(--border-2);border-radius:7px;background:#fff;color:var(--text);min-width:150px}
  .filters input:focus,.filters select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}

  /* 分页 */
  .pager{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
  .pager .info{color:var(--muted);font-size:13px;margin-right:auto}
  .pager button{min-width:34px;height:34px;padding:0 10px;border:1px solid var(--border-2);border-radius:7px;background:#fff;color:var(--text-2);transition:all .2s}
  .pager button:hover{border-color:var(--primary);color:var(--primary)}
  .pager button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .pager button:disabled{opacity:.5;cursor:not-allowed}

  /* Tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}
  .tabs button{height:40px;padding:0 18px;font-size:14px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s}
  .tabs button:hover{color:var(--primary)}
  .tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

  /* 抽屉 */
  .drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none}
  .drawer-mask.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:480px;max-width:94vw;background:#fff;z-index:81;box-shadow:-4px 0 24px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0)}
  .drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .drawer-head h3{font-size:17px}
  .drawer-body{flex:1;overflow-y:auto;padding:20px}
  .drawer-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

  /* 模态 */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:10px;width:640px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,.25);animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{font-size:17px}
  .modal-body{padding:22px;overflow-y:auto}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .x-btn{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s}
  .x-btn:hover{background:var(--bg)}

  /* 表单 */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .form-item{display:flex;flex-direction:column;gap:6px}
  .form-item.full{grid-column:1/-1}
  .form-item label{font-size:13px;color:var(--text-2);font-weight:500}
  .form-item label .req{color:var(--danger);margin-left:2px}
  .form-item input,.form-item select,.form-item textarea{font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--border-2);border-radius:7px;background:#fff;color:var(--text);width:100%}
  .form-item textarea{min-height:90px;resize:vertical}
  .form-item input:focus,.form-item select:focus,.form-item textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
  .upload{border:1px dashed var(--border-2);border-radius:8px;padding:18px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;transition:border-color .2s}
  .upload:hover{border-color:var(--primary);color:var(--primary)}
  .upload svg{width:24px;height:24px;margin:0 auto 6px}

  /* 权限树 */
  .perm-tree{border:1px solid var(--border);border-radius:8px;padding:8px 12px;max-height:420px;overflow:auto}
  .perm-mod{border-bottom:1px solid var(--border);padding:10px 0}
  .perm-mod:last-child{border-bottom:none}
  .perm-mod>.mod-head{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--text);font-size:14px}
  .perm-ops{display:flex;flex-wrap:wrap;gap:10px;padding:10px 0 4px 28px}
  .perm-ops label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);cursor:pointer;min-height:28px}
  .perm-ops input{width:16px;height:16px;accent-color:var(--primary)}

  /* 图表 */
  .chart{display:flex;align-items:flex-end;gap:14px;height:200px;padding:10px 0}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%}
  .bar .col{width:60%;max-width:46px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--primary),#69B1FF);transition:height .4s;min-height:4px}
  .bar .lab{font-size:12px;color:var(--muted)}
  .bar .val{font-size:13px;color:var(--text);font-weight:600}

  /* 时间轴（发展历程后台） */
  .tl-edit{display:flex;flex-direction:column;gap:12px}
  .tl-row{display:grid;grid-template-columns:90px 1fr 1fr auto;gap:10px;align-items:center}

  .empty{padding:50px;text-align:center;color:var(--muted)}

  /* Toast */
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:#fff;padding:12px 22px;border-radius:8px;font-size:14px;opacity:0;transition:all .3s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:1024px){.stat-row{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:768px){
    .sider{position:fixed;z-index:70;height:100vh}
    .sider:not(.open){transform:translateX(-100%)}
    .form-grid{grid-template-columns:1fr}
    .stat-row{grid-template-columns:1fr 1fr}
    .tl-row{grid-template-columns:1fr}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ====================== 侧栏 / 路由 ====================== */
function buildSider(){
  const menu=$('#siderMenu');
  menu.innerHTML=MENU.map(m=>{
    const children=m.children?m.children.filter(c=>!c.perm||can(CURRENT_ROLE,c.perm)):[];
    if(m.perm&&!can(CURRENT_ROLE,m.perm))return '';
    if(m.children&&!children.length)return '';
    if(!m.children){
      return `<div class="mi" data-nav="${m.key}">${ic(m.icon)}<span class="label">${m.label}</span></div>`;
    }
    return `<div class="mi has-sub" data-sub="${m.key}">${ic(m.icon)}<span class="label">${m.label}</span><span class="arrow">${ic('M9 6l6 6-6 6')}</span></div>
      <div class="submenu" id="sub-${m.key}">${children.map(c=>`<div class="mi" data-nav="${c.key}">${ic(c.icon)}<span class="label">${c.label}</span></div>`).join('')}</div>`;
  }).join('');
  $$('#siderMenu .mi[data-sub]').forEach(el=>el.onclick=()=>{
    const open=el.classList.toggle('open');
    $('#sub-'+el.dataset.sub).classList.toggle('open',open);
  });
  $$('#siderMenu .mi[data-nav]').forEach(el=>el.onclick=()=>navigate(el.dataset.nav));
}
let CURRENT='dashboard';
function navigate(key){
  CURRENT=key;

  $('#breadcrumb').innerHTML=parent?`${parent.label} / <b>${KEY_LABEL[key]}</b>`:`<b>${KEY_LABEL[key]||'仪表盘'}</b>`;
  const views={dashboard:renderDashboard,products:renderProducts,news:renderNews,banner:renderBanner,about:renderAbout,messages:renderMessages,users:renderUsers,rbac:renderRbac};

  $('#content').scrollTop=0;
}

function openProductModal(){
  openModal(`<h3>新增产品</h3>`,`
    <div class="form-grid">
      <div class="form-item"><label>名称 <span class="req">*</span></label><input id="p_name" placeholder="产品名称" /></div>
      <div class="form-item"><label>编号</label><input id="p_code" placeholder="如 HML-009" /></div>
      <div class="form-item"><label>所属系列</label><select id="p_series">${SERIES.map(s=>`<option>${s.name}</option>`).join('')}</select></div>
      <div class="form-item"><label>适用空间</label><select id="p_space">${CATEGORIES.map(c=>`<option>${c.name}</option>`).join('')}</select></div>
      <div class="form-item"><label>材质</label><input id="p_material" placeholder="如 北美黑胡桃木" /></div>
      <div class="form-item"><label>尺寸</label><input id="p_size" placeholder="如 240×60×220 cm" /></div>
      <div class="form-item"><label>风格</label><input id="p_style" placeholder="如 新中式" /></div>
      <div class="form-item"><label>排序</label><input id="p_sort" type="number" value="99" /></div>
      <div class="form-item"><label>状态</label><select id="p_status"><option value="1">上线</option><option value="0">下线</option></select></div>
      <div class="form-item"><label>封面图</label><div class="upload" onclick="this.querySelector('input').click()">${ic('M12 5v14M5 12h14')}<div>点击上传（jpg/png/webp ≤2MB）</div><input type="file" accept="image/*" style="display:none" onchange="toast('已选择：'+this.files[0].name)"></div></div>
      <div class="form-item full"><label>图文详情（富文本）</label><textarea id="p_desc" placeholder="产品详情描述…"></textarea></div>
    </div>`,`
    <button class="btn btn-default" data-mclose>取消</button>
    <button class="btn btn-primary" id="pSave">保存</button>`);
  $('#pSave').onclick=()=>{
    const name=$('#p_name').value.trim();if(!name){toast('请填写名称');return}
    const id=Math.max(0,...PRODUCTS.map(p=>p.id))+1;
    PRODUCTS.unshift({id,name,code:$('#p_code').value||('NEW-'+id),series:$('#p_series').value,space:$('#p_space').value,material:$('#p_material').value,size:$('#p_size').value,style:$('#p_style').value,sort:+$('#p_sort').value||99,status:+$('#p_status').value});
    toast('产品已新增（演示，未持久化）');closeModal();prodTab('list');
  };
}
function editProduct(id){const p=PRODUCTS.find(x=>x.id===id);if(!p)return;openProductModal();$('#p_name').value=p.name;$('#p_code').value=p.code;toast('编辑中：'+p.name+'（演示保存即更新）');}
function delProduct(id){if(!confirm('确认删除该产品？'))return;PRODUCTS=PRODUCTS.filter(p=>p.id!==id);toast('已删除（演示）');prodTab('list');}

function renderMessages(){
  const canView=can(CURRENT_ROLE,'message:view'),canHandle=can(CURRENT_ROLE,'message:handle');
  if(!canView){content.innerHTML=`<div class="card" style="text-align:center;padding:60px"><h3>无访问权限</h3><p style="color:var(--muted)">当前角色（${ROLES[CURRENT_ROLE].name}）无 message:view 权限，接口返回 403。</p></div>`;return;}
  content.innerHTML=`
  <div class="page-head"><h2>留言 / 询价管理</h2><p>message:view / message:handle · 手机号按 PIPL 脱敏展示</p></div>
  <div class="filters">
    <div class="f"><label>类型</label><select id="mType"><option value="">全部</option><option>留言</option><option>询价</option></select></div>
    <div class="f"><label>状态</label><select id="mStatus"><option value="">全部</option><option value="0">未处理</option><option value="1">已处理</option></select></div>
    <div class="f"><label>关键词</label><input id="mKw" placeholder="姓名/内容" /></div>
    <button class="btn btn-primary" id="mSearch">${ic('M21 21l-4-4')}查询</button>
  </div>
  <div class="card" style="padding:0"><table id="mTable"></table></div>`;
  const draw=()=>{
    const ty=$('#mType').value,kw=$('#mKw').value.trim(),st=$('#mStatus').value;
    const list=MESSAGES.filter(m=>(!ty||m.type===ty)&&(!kw||m.name.includes(kw)||m.content.includes(kw))&&(st===''||String(m.status)===st));
    $('#mTable').innerHTML=`<thead><tr><th>姓名（脱敏）</th><th>电话（脱敏）</th><th>类型</th><th>关联产品</th><th>内容</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead><tbody>
      ${list.length?list.map(m=>`<tr>
        <td>${esc(m.name)}</td><td>${maskPhone(m.phone)}</td>
        <td><span class="tag tag-gold">${m.type}</span></td><td>${esc(m.product)||'—'}</td>
        <td style="max-width:240px">${esc(m.content)}</td>
        <td>${m.status?'<span class="tag tag-green">已处理</span>':'<span class="tag tag-red">未处理</span>'}</td>
        <td>${m.time}</td>
        <td><a class="link" onclick="openMessage(${m.id})">查看</a>${canHandle&&!m.status?`<a class="link" style="color:var(--success)" onclick="handleMsg(${m.id})">标记处理</a>`:''}</td>
      </tr>`).join(''):'<tr><td colspan="8"><div class="empty">无数据</div></td></tr>'}
    </tbody>`;
  };
  $('#mSearch').onclick=draw;$('#mKw').oninput=draw;['#mType','#mStatus'].forEach(s=>$(s).onchange=draw);
  draw();
}
function openMessage(id){
  const m=MESSAGES.find(x=>x.id===id);if(!m)return;
  $('#drawer').innerHTML=`
    <div class="drawer-head"><h3>留言详情 #${m.id}</h3><button class="x-btn" onclick="closeDrawer()">${ic('M6 6l12 12M18 6L6 18')}</button></div>
    <div class="drawer-body">
      <div class="form-item" style="margin-bottom:14px"><label>姓名</label><div style="padding:8px 0">${esc(m.name)}</div></div>
      <div class="form-item" style="margin-bottom:14px"><label>电话（脱敏）</label><div style="padding:8px 0">${maskPhone(m.phone)}${can(CURRENT_ROLE,'message:handle')?' <span class="tag tag-gray" style="cursor:pointer" onclick="toast(\'授权角色可查看明文（演示）\')">查看明文</span>':''}</div></div>
      <div class="form-item" style="margin-bottom:14px"><label>邮箱</label><div style="padding:8px 0">${esc(m.email)||'—'}</div></div>
      <div class="form-item" style="margin-bottom:14px"><label>类型 / 关联产品</label><div style="padding:8px 0">${m.type} ${m.product?'/ '+esc(m.product):''}</div></div>
      <div class="form-item" style="margin-bottom:14px"><label>内容</label><div style="padding:10px;background:var(--bg);border-radius:8px">${esc(m.content)}</div></div>
      <div class="form-item" style="margin-bottom:14px"><label>状态</label><div style="padding:8px 0">${m.status?'<span class="tag tag-green">已处理</span>':'<span class="tag tag-red">未处理</span'}</div></div>
      ${m.status?`<div class="form-item" style="margin-bottom:14px"><label>处理回复（${esc(m.handler)}）</label><div style="padding:10px;background:var(--bg);border-radius:8px">${esc(m.reply)}</div></div>`:''}
      ${can(CURRENT_ROLE,'message:handle')&&!m.status?`<div class="form-item"><label>填写回复</label><textarea id="mReply" placeholder="回复内容（后台记录，可选邮件通知）"></textarea></div>`:''}
    </div>
    ${can(CURRENT_ROLE,'message:handle')&&!m.status?`<div class="drawer-foot"><button class="btn btn-default" onclick="closeDrawer()">取消</button><button class="btn btn-primary" onclick="saveReply(${m.id})">保存并处理</button></div>`:''}`;
  openDrawer();
}
function saveReply(id){const r=$('#mReply')?$('#mReply').value.trim():'';const m=MESSAGES.find(x=>x.id===id);if(m){m.status=1;m.reply=r;m.handler=$('#userName').textContent;m.handled_at='2026-09-07';}toast('已标记处理并保存回复（演示）');closeDrawer();renderMessages();}
function handleMsg(id){const m=MESSAGES.find(x=>x.id===id);if(m){m.status=1;m.handler=$('#userName').textContent;}toast('已标记为已处理（演示）');renderMessages();}

/* ---- 用户管理 ---- */
function renderUsers(){
  if(!can(CURRENT_ROLE,'rbac:user:manage')){content.innerHTML=`<div class="card" style="text-align:center;padding:60px"><h3>无访问权限</h3><p style="color:var(--muted)">当前角色无 rbac:user:manage 权限，接口返回 403。</p></div>`;return;}
  content.innerHTML=`
  <div class="page-head"><h2>用户管理</h2><p>rbac:user:manage · 新增 / 编辑 / 停用 / 分配角色 / 密码重置</p></div>
  <div class="toolbar"><button class="btn btn-primary" id="addUser">${ic('M12 5v14M5 12h14')}新增用户</button></div>
  <div class="card" style="padding:0"><table><thead><tr><th>用户名</th><th>姓名</th><th>邮箱</th><th>电话</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody>
    ${USERS.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.real_name)}</td><td>${esc(u.email)}</td><td>${maskPhone(u.phone)}</td><td><span class="tag tag-blue">${ROLES[u.role].name}</span></td><td>${statusTag(u.status)}</td><td><a class="link" onclick="toast('编辑用户（演示）')">编辑</a><a class="link" onclick="toast('密码重置（演示）')">重置密码</a><a class="link" style="color:var(--danger)" onclick="toast('停用用户（演示）')">停用</a></td></tr>`).join('')}
  </tbody></table></div>`;
  $('#addUser').onclick=()=>openModal('<h3>新增用户</h3>',`
    <div class="form-grid">
      <div class="form-item"><label>用户名 <span class="req">*</span></label><input id="u_uname" placeholder="登录名" /></div>
      <div class="form-item"><label>姓名</label><input id="u_name" placeholder="真实姓名" /></div>
      <div class="form-item"><label>邮箱</label><input id="u_email" type="email" /></div>
      <div class="form-item"><label>电话</label><input id="u_phone" placeholder="11 位手机号" /></div>
      <div class="form-item"><label>分配角色</label><select id="u_role">${Object.values(ROLES).map(r=>`<option value="${r.code}">${r.name}</option>`).join('')}</select></div>
      <div class="form-item"><label>状态</label><select id="u_status"><option value="1">启用</option><option value="0">停用</option></select></div>
    </div>`,`<button class="btn btn-default" data-mclose>取消</button><button class="btn btn-primary" id="uSave">保存</button>`);
  $('#uSave').onclick=()=>{const un=$('#u_uname').value.trim();if(!un){toast('请填写用户名');return}USERS.unshift({id:Math.max(0,...USERS.map(x=>x.id))+1,username:un,real_name:$('#u_name').value,email:$('#u_email').value,phone:$('#u_phone').value,role:$('#u_role').value,status:+$('#u_status').value});toast('用户已新增（演示）');closeModal();renderUsers();};
}

/* ---- 角色与权限管理（RBAC 权限树） ---- */
function renderRbac(){
  if(!can(CURRENT_ROLE,'rbac:role:manage')){content.innerHTML=`<div class="card" style="text-align:center;padding:60px"><h3>无访问权限</h3><p style="color:var(--muted)">当前角色无 rbac:role:manage 权限，接口返回 403。</p></div>`;return;}
  // 按模块分组权限
  const mods=[...new Set(PERMS.map(p=>p.m))];
  content.innerHTML=`
  <div class="page-head"><h2>角色与权限管理</h2><p>rbac:role:manage · 基于 2.3 权限矩阵的模块+操作树</p></div>
  <div class="card">
    <div class="card-title">角色列表 <button class="btn btn-primary btn-sm" onclick="toast('新增角色（演示）')">${ic('M12 5v14M5 12h14')}新增角色</button></div>
    <table style="margin-bottom:24px"><thead><tr><th>角色名</th><th>编码</th><th>描述</th><th>操作</th></tr></thead><tbody>
      ${ROLE_LIST.map(r=>`<tr><td>${esc(r.name)}</td><td><code>${r.code}</code></td><td>${esc(r.desc)}</td><td>${r.fixed?'<span class="tag tag-gray">系统内置·不可删</span>':'<a class="link" onclick="toast(\'编辑角色（演示）\')">编辑</a><a class="link" style="color:var(--danger)" onclick="toast(\'删除角色（演示）\')">删除</a>'}</td></tr>`).join('')}
    </tbody></table>
    <div class="card-title">权限矩阵（模块 + 操作）<span class="tag tag-gray">超级管理员默认含全部权限</span></div>
    <div class="perm-tree">
      ${mods.map(m=>`
        <div class="perm-mod">
          <div class="mod-head">${ic('M3 7h18M3 12h18M3 17h18').replace('M3 7h18','')}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>${m}</div>
          <div class="perm-ops">
            ${PERMS.filter(p=>p.m===m).map(p=>`
              <label><input type="checkbox" ${p.roles.includes('super_admin')?'checked':''} /> ${p.name} <span style="color:var(--muted)">(${p.code})</span></label>`).join('')}
          </div>
        </div>`).join('')}
    </div>
    <div style="margin-top:16px"><button class="btn btn-primary" onclick="toast('权限已保存（演示）')">保存权限配置</button></div>
  </div>`;
}

/* ====================== 模态 / 抽屉 ====================== */
function openModal(titleHtml,bodyHtml,footHtml){
  $('#modalBox').innerHTML=`<div class="modal-head"><h3>${titleHtml}</h3><button class="x-btn" data-mclose>${ic('M6 6l12 12M18 6L6 18')}</button></div><div class="modal-body">${bodyHtml}</div>${footHtml?`<div class="modal-foot">${footHtml}</div>`:''}`;
  $('#modalMask').classList.add('show');
  $$('[data-mclose]').forEach(b=>b.onclick=closeModal);
}
function closeModal(){$('#modalMask').classList.remove('show')}
$('#modalMask').onclick=e=>{if(e.target===$('#modalMask'))closeModal()};
function openDrawer(){$('#drawerMask').classList.add('show');requestAnimationFrame(()=>$('#drawer').classList.add('show'))}
function closeDrawer(){$('#drawer').classList.remove('show');setTimeout(()=>$('#drawerMask').classList.remove('show'),250)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}});

/* 初始：展示登录页（已默认隐藏 admin） */
</script>
</body>
