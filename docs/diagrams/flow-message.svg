<svg viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box{fill:#ffffff;stroke:#5b6b7b;stroke-width:1.4;rx:8}
    .start{fill:#eafaf0;stroke:#389e0d;stroke-width:1.6;rx:20}
    .end{fill:#eef3ff;stroke:#1677ff;stroke-width:1.6;rx:20}
    .opt{fill:#fff7e6;stroke:#d46b08;stroke-width:1.4;rx:8;stroke-dasharray:5 4}
    .t{font-family:sans-serif;font-size:11.5px;fill:#1f1f1f;text-anchor:middle;font-weight:600}
    .ts{font-family:sans-serif;font-size:9.5px;fill:#555;text-anchor:middle}
    .edge{stroke:#7a8694;stroke-width:1.6;marker-end:url(#ar)}
    .edgeD{stroke:#d46b08;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#aro)}
    .side{fill:#f5f5f5;stroke:#999;stroke-width:1.2;rx:8}
    .st{font-family:sans-serif;font-size:10px;fill:#444;text-anchor:middle}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8694"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d46b08"/></marker>
  </defs>

  <text x="340" y="22" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1f1f1f">留言 / 询价业务流程图（前台提交 → 后台处理闭环）</text>

  <!-- main column centered x=230, box x=60 w=340 -->
  <rect class="start" x="120" y="40" width="220" height="40"/>
  <text class="t" x="230" y="65">开始：访客浏览官网</text>

  <rect class="box" x="60" y="104" width="340" height="48"/>
  <text class="t" x="230" y="124">进入 产品详情 / 联系我们 页</text>
  <text class="ts" x="230" y="140">来源：首页·产品·关于我们入口</text>

  <rect class="box" x="60" y="172" width="340" height="48"/>
  <text class="t" x="230" y="192">填写留言 / 询价表单</text>
  <text class="ts" x="230" y="208">前端校验 + PIPL 隐私政策勾选（必填）</text>

  <rect class="box" x="60" y="240" width="340" height="48"/>
  <text class="t" x="230" y="260">提交 POST /api/v1/messages</text>
  <text class="ts" x="230" y="276">axios 拦截器统一错误处理</text>

  <rect class="box" x="60" y="308" width="340" height="48"/>
  <text class="t" x="230" y="328">后端校验 + 落库</text>
  <text class="ts" x="230" y="344">手机号加密存储 · 列表脱敏展示</text>

  <rect class="box" x="60" y="376" width="340" height="48"/>
  <text class="t" x="230" y="396">后台「留言/询价管理」列表</text>
  <text class="ts" x="230" y="412">仅 message:view 角色可见（RBAC）</text>

  <rect class="box" x="60" y="444" width="340" height="48"/>
  <text class="t" x="230" y="464">查看详情（授权看明文）</text>
  <text class="ts" x="230" y="480">明文需二次确认 / 审计</text>

  <rect class="box" x="60" y="512" width="340" height="48"/>
  <text class="t" x="230" y="532">标记处理 / 填写回复</text>
  <text class="ts" x="230" y="548">handler_id 记录处理人 + 时间</text>

  <rect class="box" x="60" y="580" width="340" height="48"/>
  <text class="t" x="230" y="600">状态 = 已处理</text>
  <text class="ts" x="230" y="616">回复仅后台记录（可选通知）</text>

  <rect class="opt" x="60" y="648" width="340" height="40"/>
  <text class="t" x="230" y="668" style="fill:#d46b08">（可选）邮件通知【待后续迭代】</text>

  <!-- side note -->
  <rect class="side" x="448" y="300" width="208" height="96"/>
  <text class="st" x="552" y="324">静态模块说明</text>
  <text class="st" x="552" y="346">新案例展示 / 招聘入口</text>
  <text class="st" x="552" y="366">为静态呈现页，后台</text>
  <text class="st" x="552" y="386">不接收表单提交</text>

  <!-- edges -->
  <line class="edge" x1="230" y1="80" x2="230" y2="104"/>
  <line class="edge" x1="230" y1="152" x2="230" y2="172"/>
  <line class="edge" x1="230" y1="220" x2="230" y2="240"/>
  <line class="edge" x1="230" y1="288" x2="230" y2="308"/>
  <line class="edge" x1="230" y1="356" x2="230" y2="376"/>
  <line class="edge" x1="230" y1="424" x2="230" y2="444"/>
  <line class="edge" x1="230" y1="492" x2="230" y2="512"/>
  <line class="edge" x1="230" y1="560" x2="230" y2="580"/>
  <line class="edgeD" x1="230" y1="628" x2="230" y2="648"/>
</svg>
